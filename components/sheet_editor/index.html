<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", "Segoe UI", sans-serif; }
  #wrap { width: 100%; position: relative; }
  #menu { position: absolute; display: none; z-index: 5; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
          box-shadow: 0 2px 10px rgba(15,23,42,.18); padding: 3px; font-size: 13px; white-space: nowrap; }
  #menu .row { display: flex; gap: 3px; }
  #menu .row + .row { margin-top: 3px; padding-top: 3px; border-top: 1px solid #e2e8f0; }
  #menu button { font: inherit; color: #0f172a; background: #f1f5f9; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px;
                 min-height: 32px; cursor: pointer; touch-action: manipulation; }
  #menu button:hover { background: #e2e8f0; }
  #menu input { font: inherit; width: 64px; min-height: 32px; box-sizing: border-box; padding: 0 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
  #menu .lbl { align-self: center; color: #475569; padding: 0 2px; }
  #menu button.on { background: #fde68a; border-color: #f59e0b; }
  svg { width: 100%; display: block; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; touch-action: pan-y; user-select: none; }
  .part { cursor: grab; touch-action: none; }
  .part.dragging { cursor: grabbing; }
  .part path { fill-opacity: .6; stroke: #1f2937; }
  .part.sel path { stroke: #f59e0b; fill-opacity: .8; }
  .part text { pointer-events: none; fill: #0f172a; font-weight: 600; }
  .info { font-size: 13px; color: #475569; padding: 5px 2px 0; min-height: 18px; line-height: 1.3; }
  .info b { color: #0f172a; }
  .info .warn { color: #6b7280; }
</style>
</head>
<body>
<div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="info" id="info"></div><div id="menu"></div></div>
<script src="geom.js"></script>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg"), info = document.getElementById("info"), menu = document.getElementById("menu");
  var HINT = "Click a part: drag it to move it (it stops at its limits), or pick Rotate / Flip from the menu.";
  var S = null;   // everything about the sheet being shown (rebuilt on every render message)

  // ---- Streamlit component protocol (no build step: plain postMessage) ----
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
  function setHeight() {
    if (!S) return;
    var w = document.getElementById("wrap").clientWidth || 600;
    var h = Math.ceil(w * S.H / S.W) + 34;
    send("streamlit:setFrameHeight", { height: h });
  }
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") render(ev.data.args || {});
  });
  window.addEventListener("resize", setHeight);
  window.__nestoState = function () { return S; };   // read-only handle for automated tests
  send("streamlit:componentReady", { apiVersion: 1 });

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(v) { return (Math.round(v * 10) / 10).toString(); }

  function render(a) {
    var keepSel = S ? S.sel : null, keepSub = S ? S.sub : null;
    var W = a.width, H = a.height, margin = a.margin || 0, spacing = a.spacing || 0;
    S = {
      W: W, H: H, margin: margin, gap: Math.max(spacing, 0.2), rev: a.rev || 0,
      parts: a.parts.map(function (p) { return Geom.makePart(p.polys); }),
      offs: a.parts.map(function () { return [0, 0]; }),
      meta: a.parts, nodes: [], sel: null, drag: null, sendTimer: null, sub: null, sw: 1, fs: 6
    };
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var sw = Math.max(W / 1800, 0.4);
    S.sw = sw;
    el("rect", { x: 0, y: 0, width: W, height: H, fill: "#ffffff" }, svg);
    el("rect", { x: margin, y: margin, width: W - 2 * margin, height: H - 2 * margin, fill: "none", stroke: "#94a3b8",
                 "stroke-width": sw, "stroke-dasharray": (sw * 5) + " " + (sw * 4) }, svg);
    (a.scrap || []).forEach(function (r) {
      el("rect", { x: r[0], y: H - r[1] - r[3], width: r[2], height: r[3], fill: "#22c55e", "fill-opacity": 0.06, stroke: "#22c55e",
                   "stroke-width": sw, "stroke-dasharray": (sw * 6) + " " + (sw * 4), "pointer-events": "none" }, svg);
    });
    var fs = Math.max(H / 40, 6);
    S.fs = fs;
    a.parts.forEach(function (p, idx) {
      var g = el("g", { "class": "part", "data-i": idx }, svg);
      S.nodes.push(g);
      paintPart(idx);
      g.addEventListener("pointerdown", function (ev) { onDown(ev, idx); });
    });
    info.innerHTML = HINT;
    setHeight();
    if (keepSel !== null && keepSel < S.nodes.length) { S.sub = keepSub; select(keepSel); } else hideMenu();
  }

  // (re)draw the outline and the name of part idx from its current polygons
  function paintPart(idx) {
    var g = S.nodes[idx], p = S.meta[idx], sw = S.sw, fs = S.fs, H = S.H, polys = S.parts[idx].polys;
    while (g.firstChild) g.removeChild(g.firstChild);
    {
      var d = "";
      polys.forEach(function (poly) {
        [poly.ext].concat(poly.holes || []).forEach(function (ring) {
          ring.forEach(function (pt, k) { d += (k ? "L" : "M") + pt[0] + "," + (H - pt[1]); });
          d += "Z";
        });
      });
      el("path", { d: d, fill: p.color || "#8ab4d8", "fill-rule": "evenodd", "stroke-width": sw * 1.4, "stroke-linejoin": "round" }, g);
      var b = S.parts[idx].bbox;
      if ((b[2] - b[0]) > p.name.length * fs * 0.55 && (b[3] - b[1]) > fs * 1.4) {
        var t = el("text", { x: (b[0] + b[2]) / 2, y: H - (b[1] + b[3]) / 2 + fs * 0.35, "text-anchor": "middle", "font-size": fs }, g);
        t.textContent = p.name;
      }
    }
  }

  function toSheet(ev) {
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [p.x, S.H - p.y];
  }
  function place(i) {
    var o = S.offs[i];
    S.nodes[i].setAttribute("transform", "translate(" + o[0] + "," + (-o[1]) + ")");
  }
  function select(i) {
    if (S.sel !== null && S.nodes[S.sel]) S.nodes[S.sel].classList.remove("sel");
    S.sel = i;
    if (i !== null) {
      S.nodes[i].classList.add("sel");
      S.nodes[i].parentNode.appendChild(S.nodes[i]);       // draw it on top
    }
    describe(false);
    showMenu();
  }

  // ---- the small menu next to the selected part: Move (drag) / Rotate / Flip ----
  var ROTATE = [["⟲ 90°", 90], ["⟳ 90°", -90], ["⟲ 15°", 15], ["⟳ 15°", -15]];
  var FLIP = [["⇋ Left–right", "h"], ["⇅ Top–bottom", "v"]];
  var angleText = "";
  function hideMenu() { menu.style.display = "none"; }
  function button(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = label; if (cls) b.className = cls;
    b.addEventListener("click", function (ev) { ev.stopPropagation(); fn(); });
    return b;
  }
  function showMenu() {
    if (!S || S.sel === null) { hideMenu(); return; }
    menu.innerHTML = "";
    var r1 = document.createElement("div"); r1.className = "row"; menu.appendChild(r1);
    r1.appendChild(button("✥ Move", S.sub ? "" : "on", function () { S.sub = null; showMenu(); describe(false); }));
    r1.appendChild(button("↻ Rotate", S.sub === "rotate" ? "on" : "", function () { S.sub = S.sub === "rotate" ? null : "rotate"; showMenu(); }));
    r1.appendChild(button("⇋ Flip", S.sub === "flip" ? "on" : "", function () { S.sub = S.sub === "flip" ? null : "flip"; showMenu(); }));
    if (S.sub) {
      var r2 = document.createElement("div"); r2.className = "row"; menu.appendChild(r2);
      (S.sub === "rotate" ? ROTATE : FLIP).forEach(function (o) {
        r2.appendChild(button(o[0], "", function () { doOp(S.sub === "rotate" ? "rotate" : "flip", o[1]); }));
      });
    }
    if (S.sub === "rotate") {                                                         // any angle
      var r3 = document.createElement("div"); r3.className = "row"; menu.appendChild(r3);
      var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Angle"; r3.appendChild(lbl);
      var inp = document.createElement("input");
      inp.type = "number"; inp.step = "any"; inp.placeholder = "°"; inp.value = angleText; inp.setAttribute("aria-label", "Rotation angle in degrees");
      inp.addEventListener("input", function () { angleText = inp.value; });
      var turn = function (sign) {
        var v = parseFloat(angleText);
        if (!isFinite(v) || v === 0 || Math.abs(v) > 720) { info.innerHTML = "<span class='warn'>Type an angle in degrees (not 0, at most 720).</span>"; return; }
        doOp("rotate", sign * v);
      };
      inp.addEventListener("keydown", function (ev) { ev.stopPropagation(); if (ev.key === "Enter") { ev.preventDefault(); turn(1); } });
      r3.appendChild(inp);
      r3.appendChild(button("⟲ °", "", function () { turn(1); }));
      r3.appendChild(button("⟳ °", "", function () { turn(-1); }));
    }
    menu.style.display = "block";
    placeMenu();
  }
  function placeMenu() {
    if (!S || S.sel === null) return;
    var wr = document.getElementById("wrap").getBoundingClientRect(), sr = svg.getBoundingClientRect();
    var k = sr.width / S.W, b = S.parts[S.sel].bbox, o = S.offs[S.sel];
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = sr.left - wr.left + ((b[0] + b[2]) / 2 + o[0]) * k - mw / 2;
    var top = sr.top - wr.top + (S.H - (b[3] + o[1])) * k - mh - 6;                 // above the part ...
    if (top < 0) top = sr.top - wr.top + (S.H - (b[1] + o[1])) * k + 6;             // ... or below it when there is no room
    left = Math.max(0, Math.min(left, wr.width - mw));
    top = Math.max(0, Math.min(top, sr.top - wr.top + sr.height - mh));
    menu.style.left = left + "px"; menu.style.top = top + "px";
  }

  // rotate / flip the selected part about the centre of its bounding box, only when it has room
  function doOp(op, value) {
    var i = S.sel;
    if (i === null || S.drag) return;
    var o = S.offs[i];
    var polys = Geom.transformPolys(S.parts[i].polys, o[0], o[1], op, value);
    var part = Geom.makePart(polys);
    var sh = Geom.shiftIntoSheet(part, S.W, S.H, S.margin);                          // a part at the edge may be pushed back in
    if (sh) { polys = Geom.translatePolys(polys, sh[0], sh[1]); part = Geom.makePart(polys); }
    if (!sh || !Geom.fits(S.parts, S.offs, i, part, 0, 0, S.W, S.H, S.margin, S.gap)) {
      info.innerHTML = "<b>" + S.meta[i].name + "</b> &nbsp; <span class='warn'>not enough room to " +
        (op === "rotate" ? "rotate" : "flip") + " it here: move it or its neighbours first</span>";
      return;
    }
    S.parts[i] = part; S.offs[i] = [0, 0];
    paintPart(i); place(i); describe(false); placeMenu();
    clearTimeout(S.sendTimer);
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { id: Math.random().toString(36).slice(2) + Date.now().toString(36), rev: S.rev, part: i, op: op, value: value,
               ox: o[0], oy: o[1], nx: sh[0], ny: sh[1] }
    });
  }
  function describe(blocked) {
    if (S.sel === null) return;
    var i = S.sel, b = S.parts[i].bbox, o = S.offs[i];
    info.innerHTML = "<b>" + S.meta[i].name + "</b> &nbsp; x " + fmt(b[0] + o[0]) + " &nbsp; y " + fmt(b[1] + o[1]) +
      " &nbsp; (" + fmt(b[2] - b[0]) + " × " + fmt(b[3] - b[1]) + ")" +
      (blocked ? " &nbsp; <span class='warn'>at its limit (part spacing / edge margin / neighbour)</span>" : "");
  }

  function onDown(ev, i) {
    ev.preventDefault();
    try { window.focus(); } catch (e) {}                 // preventDefault stops the browser doing it: needed for arrow keys / Escape
    var g = S.nodes[i];
    select(i);                                   // lifts the part to the front (moves its element) - BEFORE capturing
    var p = toSheet(ev);
    S.drag = { i: i, gx: p[0] - S.offs[i][0], gy: p[1] - S.offs[i][1], raf: false, last: null, pid: ev.pointerId };
    g.classList.add("dragging");
    hideMenu();
    // the sheet drawing itself follows the pointer: it is never moved in the DOM, so the capture cannot be lost
    try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerup", onUp);
    svg.addEventListener("pointercancel", onUp);
  }
  function onMove(ev) {
    if (!S.drag) return;
    S.drag.last = toSheet(ev);
    if (S.drag.raf) return;
    S.drag.raf = true;
    requestAnimationFrame(function () {
      var d = S.drag;
      if (!d) return;
      d.raf = false;
      var i = d.i, tx = d.last[0] - d.gx, ty = d.last[1] - d.gy;
      var r = Geom.moveConstrained(S.parts, S.offs, i, S.offs[i][0], S.offs[i][1], tx, ty, S.W, S.H, S.margin, S.gap);
      S.offs[i] = [r[0], r[1]];
      place(i);
      var short = Math.hypot(tx - r[0], ty - r[1]) > 0.5;
      describe(r[2] && short);
    });
  }
  function onUp(ev) {
    var d = S.drag;
    if (!d) return;
    svg.removeEventListener("pointermove", onMove);
    svg.removeEventListener("pointerup", onUp);
    svg.removeEventListener("pointercancel", onUp);
    try { svg.releasePointerCapture(d.pid); } catch (e) {}
    var g = S.nodes[d.i];
    if (g) g.classList.remove("dragging", "blocked");
    // apply the last pointer position that the animation frame has not processed yet
    if (d.last) {
      var tx = d.last[0] - d.gx, ty = d.last[1] - d.gy;
      var r = Geom.moveConstrained(S.parts, S.offs, d.i, S.offs[d.i][0], S.offs[d.i][1], tx, ty, S.W, S.H, S.margin, S.gap);
      S.offs[d.i] = [r[0], r[1]];
      place(d.i);
    }
    S.drag = null;
    describe(false);
    showMenu();
    emit(d.i);
  }
  function emit(i) {
    var o = S.offs[i];
    if (Math.abs(o[0]) < 1e-6 && Math.abs(o[1]) < 1e-6) return;
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { id: Math.random().toString(36).slice(2) + Date.now().toString(36), rev: S.rev, part: i, dx: o[0], dy: o[1] }
    });
  }

  // clicking the empty sheet deselects
  svg.addEventListener("pointerdown", function (ev) {
    if (!S || ev.target.closest(".part")) return;                    // a part was hit: onDown handles it
    select(null);
    info.innerHTML = HINT;
  });

  // leaving the sheet closes the menu: a click anywhere else on the page takes the focus away from this frame
  function deselect() {
    if (!S || S.sel === null || S.drag) return;
    select(null);
    S.sub = null;
    info.innerHTML = HINT;
  }
  window.addEventListener("blur", deselect);
  document.addEventListener("pointerdown", function (ev) {                           // empty area of the frame itself
    if (ev.target.closest && (ev.target.closest("svg") || ev.target.closest("#menu"))) return;
    deselect();
  });
  try { window.parent.document.addEventListener("pointerdown", function () { deselect(); }, true); } catch (e) {}
  window.addEventListener("keydown", function (ev) { if (ev.key === "Escape") deselect(); });

  // arrow keys nudge the selected part: 1 unit, Shift = 10, Ctrl/Alt = 0.1
  window.addEventListener("keydown", function (ev) {
    if (!S || S.sel === null || ev.key.indexOf("Arrow") !== 0) return;
    if (ev.target && ev.target.tagName === "INPUT") return;                           // typing in the angle box
    ev.preventDefault();
    var st = ev.shiftKey ? 10 : (ev.ctrlKey || ev.altKey) ? 0.1 : 1;
    var dx = ev.key === "ArrowLeft" ? -st : ev.key === "ArrowRight" ? st : 0;
    var dy = ev.key === "ArrowDown" ? -st : ev.key === "ArrowUp" ? st : 0;
    var i = S.sel, o = S.offs[i];
    var r = Geom.moveConstrained(S.parts, S.offs, i, o[0], o[1], o[0] + dx, o[1] + dy, S.W, S.H, S.margin, S.gap);
    S.offs[i] = [r[0], r[1]];
    place(i);
    describe(r[2] && Math.hypot(r[0] - o[0] - dx, r[1] - o[1] - dy) > 1e-6);
    placeMenu();
    clearTimeout(S.sendTimer);
    S.sendTimer = setTimeout(function () { emit(i); }, 450);
  });
})();
</script>
</body>
</html>
