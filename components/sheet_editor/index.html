<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", "Segoe UI", sans-serif; }
  #wrap { width: 100%; }
  svg { width: 100%; display: block; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; touch-action: pan-y; user-select: none; }
  .part { cursor: grab; touch-action: none; }
  .part.dragging { cursor: grabbing; }
  .part path { fill-opacity: .6; stroke: #1f2937; }
  .part.sel path { stroke: #f59e0b; fill-opacity: .8; }
  .part.blocked path { fill: #ef4444 !important; fill-opacity: .75; }
  .part text { pointer-events: none; fill: #0f172a; font-weight: 600; }
  .info { font-size: 13px; color: #475569; padding: 5px 2px 0; min-height: 18px; line-height: 1.3; }
  .info b { color: #0f172a; }
  .info .warn { color: #b91c1c; }
</style>
</head>
<body>
<div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="info" id="info"></div></div>
<script src="geom.js"></script>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg"), info = document.getElementById("info");
  var S = null;   // everything about the sheet being shown (rebuilt on every render message)

  // ---- Streamlit component protocol (no build step: plain postMessage) ----
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
  function setHeight() {
    if (!S) return;
    var w = document.getElementById("wrap").clientWidth || 600;
    var h = Math.ceil(w * S.H / S.W) + 34;
    send("streamlit:setFrameHeight", { height: h });
  }
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render") render(ev.data.args || {});
  });
  window.addEventListener("resize", setHeight);
  window.__nestoState = function () { return S; };   // read-only handle for automated tests
  send("streamlit:componentReady", { apiVersion: 1 });

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(v) { return (Math.round(v * 10) / 10).toString(); }

  function render(a) {
    var W = a.width, H = a.height, margin = a.margin || 0, spacing = a.spacing || 0;
    S = {
      W: W, H: H, margin: margin, gap: Math.max(spacing, 0.2), rev: a.rev || 0,
      parts: a.parts.map(function (p) { return Geom.makePart(p.polys); }),
      offs: a.parts.map(function () { return [0, 0]; }),
      meta: a.parts, nodes: [], sel: null, drag: null, sendTimer: null
    };
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var sw = Math.max(W / 1800, 0.4);
    el("rect", { x: 0, y: 0, width: W, height: H, fill: "#ffffff" }, svg);
    el("rect", { x: margin, y: margin, width: W - 2 * margin, height: H - 2 * margin, fill: "none", stroke: "#94a3b8",
                 "stroke-width": sw, "stroke-dasharray": (sw * 5) + " " + (sw * 4) }, svg);
    (a.scrap || []).forEach(function (r) {
      el("rect", { x: r[0], y: H - r[1] - r[3], width: r[2], height: r[3], fill: "#22c55e", "fill-opacity": 0.06, stroke: "#22c55e",
                   "stroke-width": sw, "stroke-dasharray": (sw * 6) + " " + (sw * 4), "pointer-events": "none" }, svg);
    });
    var fs = Math.max(H / 40, 6);
    a.parts.forEach(function (p, idx) {
      var g = el("g", { "class": "part", "data-i": idx }, svg);
      var d = "";
      p.polys.forEach(function (poly) {
        [poly.ext].concat(poly.holes || []).forEach(function (ring) {
          ring.forEach(function (pt, k) { d += (k ? "L" : "M") + pt[0] + "," + (H - pt[1]); });
          d += "Z";
        });
      });
      el("path", { d: d, fill: p.color || "#8ab4d8", "fill-rule": "evenodd", "stroke-width": sw * 1.4, "stroke-linejoin": "round" }, g);
      var b = S.parts[idx].bbox;
      if ((b[2] - b[0]) > p.name.length * fs * 0.55 && (b[3] - b[1]) > fs * 1.4) {
        var t = el("text", { x: (b[0] + b[2]) / 2, y: H - (b[1] + b[3]) / 2 + fs * 0.35, "text-anchor": "middle", "font-size": fs }, g);
        t.textContent = p.name;
      }
      g.addEventListener("pointerdown", function (ev) { onDown(ev, idx); });
      S.nodes.push(g);
    });
    info.innerHTML = "Click a part and drag it. It stops when it touches a neighbouring part or the sheet edge.";
    setHeight();
  }

  function toSheet(ev) {
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [p.x, S.H - p.y];
  }
  function place(i) {
    var o = S.offs[i];
    S.nodes[i].setAttribute("transform", "translate(" + o[0] + "," + (-o[1]) + ")");
  }
  function select(i) {
    if (S.sel !== null && S.nodes[S.sel]) S.nodes[S.sel].classList.remove("sel");
    S.sel = i;
    if (i !== null) {
      S.nodes[i].classList.add("sel");
      S.nodes[i].parentNode.appendChild(S.nodes[i]);       // draw it on top
    }
    describe(false);
  }
  function describe(blocked) {
    if (S.sel === null) return;
    var i = S.sel, b = S.parts[i].bbox, o = S.offs[i];
    info.innerHTML = "<b>" + S.meta[i].name + "</b> &nbsp; x " + fmt(b[0] + o[0]) + " &nbsp; y " + fmt(b[1] + o[1]) +
      " &nbsp; (" + fmt(b[2] - b[0]) + " × " + fmt(b[3] - b[1]) + ")" +
      (blocked ? " &nbsp; <span class='warn'>stopped: a neighbouring part or the sheet edge is in the way</span>" : "");
  }

  function onDown(ev, i) {
    ev.preventDefault();
    var g = S.nodes[i];
    select(i);                                   // lifts the part to the front (moves its element) - BEFORE capturing
    var p = toSheet(ev);
    S.drag = { i: i, gx: p[0] - S.offs[i][0], gy: p[1] - S.offs[i][1], raf: false, last: null, pid: ev.pointerId };
    g.classList.add("dragging");
    // the sheet drawing itself follows the pointer: it is never moved in the DOM, so the capture cannot be lost
    try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerup", onUp);
    svg.addEventListener("pointercancel", onUp);
  }
  function onMove(ev) {
    if (!S.drag) return;
    S.drag.last = toSheet(ev);
    if (S.drag.raf) return;
    S.drag.raf = true;
    requestAnimationFrame(function () {
      var d = S.drag;
      if (!d) return;
      d.raf = false;
      var i = d.i, tx = d.last[0] - d.gx, ty = d.last[1] - d.gy;
      var r = Geom.moveConstrained(S.parts, S.offs, i, S.offs[i][0], S.offs[i][1], tx, ty, S.W, S.H, S.margin, S.gap);
      S.offs[i] = [r[0], r[1]];
      place(i);
      var short = Math.hypot(tx - r[0], ty - r[1]) > 0.5;
      S.nodes[i].classList.toggle("blocked", r[2] && short);
      describe(r[2] && short);
    });
  }
  function onUp(ev) {
    var d = S.drag;
    if (!d) return;
    svg.removeEventListener("pointermove", onMove);
    svg.removeEventListener("pointerup", onUp);
    svg.removeEventListener("pointercancel", onUp);
    try { svg.releasePointerCapture(d.pid); } catch (e) {}
    var g = S.nodes[d.i];
    if (g) g.classList.remove("dragging", "blocked");
    // apply the last pointer position that the animation frame has not processed yet
    if (d.last) {
      var tx = d.last[0] - d.gx, ty = d.last[1] - d.gy;
      var r = Geom.moveConstrained(S.parts, S.offs, d.i, S.offs[d.i][0], S.offs[d.i][1], tx, ty, S.W, S.H, S.margin, S.gap);
      S.offs[d.i] = [r[0], r[1]];
      place(d.i);
    }
    S.drag = null;
    describe(false);
    emit(d.i);
  }
  function emit(i) {
    var o = S.offs[i];
    if (Math.abs(o[0]) < 1e-6 && Math.abs(o[1]) < 1e-6) return;
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { id: Math.random().toString(36).slice(2) + Date.now().toString(36), rev: S.rev, part: i, dx: o[0], dy: o[1] }
    });
  }

  // clicking the empty sheet deselects
  svg.addEventListener("pointerdown", function (ev) {
    if (!S || ev.target.closest(".part")) return;                    // a part was hit: onDown handles it
    select(null);
    info.innerHTML = "Click a part and drag it. It stops when it touches a neighbouring part or the sheet edge.";
  });

  // arrow keys nudge the selected part: 1 unit, Shift = 10, Ctrl/Alt = 0.1
  window.addEventListener("keydown", function (ev) {
    if (!S || S.sel === null || ev.key.indexOf("Arrow") !== 0) return;
    ev.preventDefault();
    var st = ev.shiftKey ? 10 : (ev.ctrlKey || ev.altKey) ? 0.1 : 1;
    var dx = ev.key === "ArrowLeft" ? -st : ev.key === "ArrowRight" ? st : 0;
    var dy = ev.key === "ArrowDown" ? -st : ev.key === "ArrowUp" ? st : 0;
    var i = S.sel, o = S.offs[i];
    var r = Geom.moveConstrained(S.parts, S.offs, i, o[0], o[1], o[0] + dx, o[1] + dy, S.W, S.H, S.margin, S.gap);
    S.offs[i] = [r[0], r[1]];
    place(i);
    describe(r[2] && Math.hypot(r[0] - o[0] - dx, r[1] - o[1] - dy) > 1e-6);
    clearTimeout(S.sendTimer);
    S.sendTimer = setTimeout(function () { emit(i); }, 450);
  });
})();
</script>
</body>
</html>
